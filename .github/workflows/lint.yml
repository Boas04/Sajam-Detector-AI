name: 🐍 Python Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint with Flake8
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Instal flake8
        run: pip install flake8

      - name: 🔍 Jalankan Flake8
        run: |
          # Periksa error sintaks dan masalah kritis saja (E9xx, F63x, F7xx, F82x)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.venv,venv,env,.git,__pycache__
