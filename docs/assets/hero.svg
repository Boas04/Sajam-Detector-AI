<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#bg)" rx="16"/>

  <!-- Decorative grid lines -->
  <g stroke="#0f3460" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
  </g>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="900" height="6" fill="url(#accent)" rx="3"/>

  <!-- Shield icon -->
  <g transform="translate(100, 160)">
    <path d="M50,0 L90,20 L90,70 Q90,110 50,130 Q10,110 10,70 L10,20 Z"
          fill="none" stroke="#e94560" stroke-width="3" opacity="0.9"/>
    <path d="M50,30 L70,42 L70,72 Q70,92 50,102 Q30,92 30,72 L30,42 Z"
          fill="#e94560" opacity="0.25"/>
    <text x="50" y="80" font-family="monospace" font-size="36" fill="#e94560"
          text-anchor="middle" dominant-baseline="middle">🛡</text>
  </g>

  <!-- Main title -->
  <text x="230" y="155" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="800" fill="#ffffff" letter-spacing="1">
    Sajam Detector AI
  </text>

  <!-- Accent underline -->
  <rect x="230" y="166" width="340" height="4" fill="url(#accent)" rx="2"/>

  <!-- Tagline -->
  <text x="230" y="210" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="18" fill="#a0aec0" letter-spacing="0.5">
    Deteksi Senjata Tajam Tradisional secara Real-Time
  </text>

  <!-- Sub info -->
  <text x="230" y="248" font-family="monospace" font-size="14" fill="#718096">
    YOLO11 · Streamlit · OpenCV · Python
  </text>

  <!-- Classes pills -->
  <g transform="translate(230, 275)">
    <rect x="0" y="0" width="80" height="28" fill="#e94560" opacity="0.2" rx="14"/>
    <text x="40" y="14" font-family="monospace" font-size="12" fill="#e94560"
          text-anchor="middle" dominant-baseline="middle">Golok</text>

    <rect x="92" y="0" width="80" height="28" fill="#e94560" opacity="0.2" rx="14"/>
    <text x="132" y="14" font-family="monospace" font-size="12" fill="#e94560"
          text-anchor="middle" dominant-baseline="middle">Celurit</text>

    <rect x="184" y="0" width="80" height="28" fill="#e94560" opacity="0.2" rx="14"/>
    <text x="224" y="14" font-family="monospace" font-size="12" fill="#e94560"
          text-anchor="middle" dominant-baseline="middle">Parang</text>
  </g>

  <!-- Bounding box mock UI (right side) -->
  <g transform="translate(620, 80)">
    <!-- Camera frame -->
    <rect x="0" y="0" width="220" height="240" fill="#0d1117" rx="8" stroke="#30363d" stroke-width="1.5"/>

    <!-- Mock video frame background -->
    <rect x="8" y="8" width="204" height="224" fill="#161b22" rx="4"/>

    <!-- Fake bounding box 1 - Golok -->
    <rect x="30" y="40" width="80" height="100" fill="none" stroke="#e94560" stroke-width="2.5"
          stroke-dasharray="0" rx="2"/>
    <!-- Corner decorations -->
    <polyline points="30,40 30,54" stroke="#e94560" stroke-width="4" fill="none"/>
    <polyline points="30,40 44,40" stroke="#e94560" stroke-width="4" fill="none"/>
    <polyline points="110,40 96,40" stroke="#e94560" stroke-width="4" fill="none"/>
    <polyline points="110,40 110,54" stroke="#e94560" stroke-width="4" fill="none"/>
    <polyline points="30,140 30,126" stroke="#e94560" stroke-width="4" fill="none"/>
    <polyline points="30,140 44,140" stroke="#e94560" stroke-width="4" fill="none"/>
    <polyline points="110,140 96,140" stroke="#e94560" stroke-width="4" fill="none"/>
    <polyline points="110,140 110,126" stroke="#e94560" stroke-width="4" fill="none"/>

    <!-- Label -->
    <rect x="30" y="28" width="70" height="16" fill="#e94560" rx="3"/>
    <text x="65" y="36" font-family="monospace" font-size="9" fill="white"
          text-anchor="middle" dominant-baseline="middle">Golok 91%</text>

    <!-- Fake bounding box 2 - Celurit (smaller) -->
    <rect x="125" y="90" width="68" height="80" fill="none" stroke="#f6c90e" stroke-width="2" rx="2"/>
    <rect x="125" y="78" width="62" height="16" fill="#f6c90e" rx="3"/>
    <text x="156" y="86" font-family="monospace" font-size="9" fill="#1a1a2e"
          text-anchor="middle" dominant-baseline="middle">Celurit 87%</text>

    <!-- Scan line animation hint -->
    <line x1="8" y1="120" x2="212" y2="120" stroke="#00ff88" stroke-width="1" opacity="0.4"/>

    <!-- Status bar -->
    <rect x="8" y="200" width="204" height="24" fill="#0f3460" rx="3"/>
    <circle cx="20" cy="212" r="5" fill="#00ff88"/>
    <text x="32" y="212" font-family="monospace" font-size="9" fill="#a0aec0"
          dominant-baseline="middle">LIVE · 2 objek terdeteksi</text>
  </g>

  <!-- Bottom tagline -->
  <text x="450" y="380" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" fill="#4a5568" text-anchor="middle">
    Universitas Pancasila · Tugas Akhir Pembelajaran Mesin 2025/2026
  </text>

  <!-- Accent bar bottom -->
  <rect x="0" y="394" width="900" height="6" fill="url(#accent)" rx="3"/>
</svg>
